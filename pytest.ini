[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --asyncio-mode=auto
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires database/redis)
    e2e: End-to-end tests (requires full stack)
    slow: Slow tests (skip during rapid development)
    auth: Authentication-related tests
    search: Search functionality tests
    scraper: Scraper and platform tests
